<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sehgal Autoriders — Receipt Received</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #5b6472;
    --border: #d7dce3;
    --accent: #1c9a5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --text: #f1f3f6;
      --muted: #a3adba;
      --border: #333844;
      --accent: #3ecf85;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 24px;
    text-align: center;
  }
  .check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent);
    color: #ffffff;
    font-size: 2.2rem;
    line-height: 1;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1.3rem;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
</style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>Receipt received</h1>
  <p>Thank you. Our accounts team will verify your payment and confirm on WhatsApp.</p>
</div>
</body>
</html>
